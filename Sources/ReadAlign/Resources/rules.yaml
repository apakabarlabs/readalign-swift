# The numbers the alignment is tuned to. Shared by every port of this library, so
# that changing one changes all of them rather than leaving them quietly apart.
#
# What each is for is written up in the README of the Swift library, under
# "How it works". This file is copied into every port, so that is where it stays.

# How alike two words must be to count as the same word.
match_threshold: 0.6

# A join is held to at least this, however low the match bar is set: loosely,
# joining swallows the neighbouring word whole.
join_floor: 0.9

# Passing a word over, on either side.
gap_penalty: -0.5

# A pairing below its bar. Only its being worse than two gaps matters.
mismatch_penalty: -1.5

# Shorter than this and a word has no stretch of the recording to be found at.
room_enough: 0.04

# How many heard words one written word may be spread over when print says
# nothing: a compound gives its own count, anything else may still take a pair,
# since a recogniser splits a long word wherever it likes.
join_span: 2

# Letters that open a syllable for the English weighting.
english_vowels: "aeiouy"

# The silent final "e" of English, which closes no syllable of its own -- except
# after "l", or "little" comes out as one syllable. A word shorter than this
# has no syllable to spare.
silent_ending: "e"
silent_ending_except_after: "le"
shortest_with_a_silent_ending: 3

# No word weighs less than this, whoever wrote the weighting, or a run of them
# shares a pause by dividing by nothing.
lightest_word: 1

# Likeness is measured with the marks taken off, because a recogniser trained on
# plain Latin returns "casa" for "čaša" and the word is still the word.
#
# Which marks come off is named here rather than left to whatever each language
# calls a diacritic: those tables disagree, and a port would answer differently
# from its sibling on whole writing systems. This range is the Latin combining
# diacritics and nothing else. A voiced-sound mark on Japanese kana and a vowel
# sign in Devanagari are combining marks too, and lifting them would turn one word
# into a different one: さ is not ざ.
lifted_marks_from: "0300"
lifted_marks_to: "036F"

# Marks that write one consonant joined to the next, so that the two are one letter
# on the page and count as one when two spellings are compared. Which of them do this
# is not something each port may answer for itself, so they are named here.
#
# A script is on this list once its cases are in the corpus. Several scripts write a
# mark that looks like these and do not join their consonants with it -- Tamil and
# Kannada among them -- so a script is added by being shown, not by resemblance.
letter_joiners:
  - "094D"   # Devanagari
  - "09CD"   # Bengali
  - "0ACD"   # Gujarati
  - "0B4D"   # Oriya
  - "0C4D"   # Telugu
  - "0D4D"   # Malayalam
  - "1039"   # Myanmar
  - "11133"  # Chakma

# Letters that carry their mark through the letter itself, so there is nothing
# above them to lift.
folded_letters:
  "ł": "l"
  "đ": "d"
  "ø": "o"
  "ħ": "h"
  "ŧ": "t"

# Holding a word open through the silence after it, which needs the recording.
# Short enough to find the edge of a consonant, long enough that one loud sample
# cannot pass for speech.
frame_seconds: 0.01

# Louder than the room, quieter than a voice. Taken from the recording rather than
# fixed, because one reader is recorded hotter than another: the quietest tenth of
# the frames is the room, and speech is what stands well clear of it.
room_quantile: 0.1
speech_above_room: 4
quietest_room: 0.0001

# How far past its own mark a word may be held.
hold_limit: 0.6

# How loud this recording speaks, taken as the mean of its loudest share. Speech
# occupies rather more than half of a reading, so half lands inside the voice
# rather than on its peaks, and one reader recorded hotter than another is
# measured against themselves. A recording with nothing in it still has to answer
# something above zero, or everything measured against it is divided by nothing.
speech_from_loudest_share: 0.5
quietest_speech: 0.000001

# Cutting a recording into pieces a recogniser is given one at a time.
#
# Every side has to cut the same reading the same way, or the same voice is answered
# differently by each of them: a piece boundary changes what comes back near it, and
# one runtime that cuts at fifteen seconds of its own while another is handed the whole
# recording is two different questions asked of one model.
#
# Shorter than any runtime's own window, so that ours is the only cut ever made. A piece
# may end early to land in a pause, but never earlier than half, or a reading is minced
# into pieces too short to carry a line.
piece_seconds: 12
shortest_piece_share: 0.5

# Quiet for this long is a pause a cut may fall in. Shorter than that is the stop before
# a consonant, and cutting there takes a word in half.
pause_seconds: 0.2

# How much of the piece before the next one takes at the least, when no pause offers itself
# to begin at. Without a floor the two pieces meet edge to edge and share nothing: a
# recogniser invents a word while it is hearing the last of what it was given, and with no
# ground in common there is nothing for the join to catch it against. Measured on the whole
# corpus, ten of the readings met that way and every one of them gained a word on the side
# that pads its input. Wider than the longest trim asked for on an empty piece, so a
# trimmed tail is always covered by the piece that follows.
least_overlap: 2.0

# Each piece begins a pause earlier than the one before it ended, so every word is heard
# whole by at least one piece. What the overlap says twice is dropped by the text alone:
# the run of words the piece before already said comes off the front of the one coming,
# searched only as far as the ground both pieces cover. By the text and not by the clock,
# because the clock is the one thing two builds of one model do not share.
#
# The run is the longest the two pieces say alike, found anywhere inside the overlap
# rather than at its very edges: a recogniser drops or invents a word at the edge of what
# it was given — one piece ended "...by time decease we" where the other heard no "we" at
# all — and a run pinned to the edges would then find nothing and leave the whole overlap
# said twice. Past the run the coming piece is believed and the piece before it is not:
# they cover the same seconds there, and the one that goes on past them heard them with
# what follows while the other was hearing the last of what it was given. There is no
# number here at all.

# Asking again when the recogniser answers nothing at all.
#
# Parakeet returns an empty answer for some pieces of ordinary speech, and whether it does
# turns on where the piece starts and how long it is together rather than on the speech in
# it. Handing over a little less of the tail moves it off that edge. These are the lengths
# to take off, in the order to try them, keeping the first answer that is not empty;
# measured over the sonnets they gave back every silent piece. The cost is the trimmed
# tail, which the overlap with the next piece has to cover.
ask_again_trims: [0.1, 0.2, 0.3, 0.5, 0.8, 1.3]

# Shorter than this and nothing heard is an answer rather than a defect: there is not
# enough in the piece to expect words from it.
shortest_worth_asking_again: 2.0
