included:
  - Sources
  - Tests

excluded:
  - .build
  - Package.swift

analyzer_rules:
  - unused_import
  - unused_declaration

disabled_rules:
  # swift-format places the brace after a wrapped return type or condition on
  # the following line. Requiring the opposite makes `format` and `lint`
  # mutually destructive.
  - opening_brace
  # swift-format puts parameters of a wrapped closure after the opening brace;
  # SwiftLint's closure_parameter_position rule requires the opposite layout.
  - closure_parameter_position
