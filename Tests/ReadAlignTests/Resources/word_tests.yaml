# The two word-level helpers the alignment is built on.
#
# `normalize` strips what a recogniser drops or invents. `similarity` is 1 for
# identical and 0 for nothing in common; a case pins it with `equals`, `at_least`
# or `at_most`, because most of what matters about it is which side of a bar it
# falls on rather than its exact value.
# How many words print writes one word as, which is the ceiling on how many heard
# words it may be spread over. Marks at the edges and doubled marks are not parts.
printed_parts:
  - word: "word"
    parts: 1
  - word: "swift-footed"
    parts: 2
  - word: "world-without-end"
    parts: 3
  - word: "well-to-do-"
    parts: 3
  - word: "over--seas"
    parts: 2
  - word: "-"
    parts: 1

letters:
  # Where a word is cut into letters, pinned letter by letter. The joined string
  # cannot pin it: two libraries that disagree about where the cuts fall still
  # write the same string once the pieces are put back together, which is how a
  # port came to read a Persian word as something its siblings did not read and
  # passed every case in this file while doing it.
  #
  # A script named here is one this library is held to. Adding another means
  # adding its cases first, and the letters of a writing system nobody has
  # written down here are not something a port may decide for itself.

  # Latin. A letter and the mark above it are one letter, however the text spells
  # them, and a ligature is one letter because a reader sees one.
  - word: "\u00C5ngstr\u00F6m"
    want: ["\u00E5", "n", "g", "s", "t", "r", "\u00F6", "m"]
  - word: "A\u030Angstro\u0308m"
    want: ["\u00E5", "n", "g", "s", "t", "r", "\u00F6", "m"]
  - word: "\u0130stanbul"
    want: ["i\u0307", "s", "t", "a", "n", "b", "u", "l"]
  - word: "\uFB01ne"
    want: ["\uFB01", "n", "e"]
  - word: "\u01C5ungla"
    want: ["\u01C6", "u", "n", "g", "l", "a"]

  # Cyrillic and Greek. Lowercasing a final sigma is the language's rule, not a
  # mark being lifted.
  - word: "\u043C\u043E\u0439"
    want: ["\u043C", "\u043E", "\u0439"]
  - word: "\u039F\u0394\u039F\u03A3"
    want: ["\u03BF", "\u03B4", "\u03BF", "\u03C2"]
  - word: "\u03A3"
    want: ["\u03C3"]
  - word: "\u03A3\u03A3"
    want: ["\u03C3", "\u03C2"]
  - word: "\u039F\u0394\u039F\u03A3A"
    want: ["\u03BF", "\u03B4", "\u03BF", "\u03C3", "a"]

  # Devanagari. A consonant joined to the next by a virama is one letter, and the
  # zero-width joiner that keeps them apart is part of the letter it belongs to.
  - word: "\u0928\u092E\u0938\u094D\u0924\u0947"
    want: ["\u0928", "\u092E", "\u0938\u094D\u0924\u0947"]
  - word: "\u0928\u092E\u0938\u0924\u0947"
    want: ["\u0928", "\u092E", "\u0938", "\u0924\u0947"]
  - word: "\u0915\u094D\u200C\u0937"
    want: ["\u0915\u094D\u200C", "\u0937"]

  # Other scripts that join a consonant to the next one, and two that write a mark
  # which looks the same and do not.
  - word: "\u0995\u09CD\u0995"
    want: ["\u0995\u09CD\u0995"]
  - word: "\u0C15\u0C4D\u0C15"
    want: ["\u0C15\u0C4D\u0C15"]
  - word: "\u0D15\u0D4D\u0D15"
    want: ["\u0D15\u0D4D\u0D15"]
  - word: "\u0B95\u0BCD\u0B95"
    want: ["\u0B95\u0BCD", "\u0B95"]
  - word: "\u0C95\u0CCD\u0C95"
    want: ["\u0C95\u0CCD", "\u0C95"]

  # Thai. A vowel written above or below its consonant belongs to it.
  - word: "\u0E2A\u0E27\u0E31\u0E2A\u0E14\u0E35"
    want: ["\u0E2A", "\u0E27\u0E31", "\u0E2A", "\u0E14\u0E35"]

  # Hangul, written as syllables and written as the pieces they are built from.
  - word: "\uAC00\uB098"
    want: ["\uAC00", "\uB098"]
  - word: "\u1100\u1161\u11A8"
    want: ["\uAC01"]

  # Georgian, which writes no marks at all, and Japanese kana, where the voicing
  # mark is part of the letter however it is spelled.
  - word: "\u10D2\u10D0\u10DB\u10D0\u10E0\u10EF\u10DD\u10D1\u10D0"
    want: ["\u10D2", "\u10D0", "\u10DB", "\u10D0", "\u10E0", "\u10EF", "\u10DD", "\u10D1", "\u10D0"]
  - word: "\u3056\u308B"
    want: ["\u3056", "\u308B"]
  - word: "\u3055\u3099\u308B"
    want: ["\u3056", "\u308B"]

  # Arabic and Persian. The zero-width non-joiner is written inside a word to keep
  # two letters from joining up, and taking it out leaves a different word.
  - word: "\u0645\u06CC\u200C\u0631\u0648\u0645"
    want: ["\u0645", "\u06CC\u200C", "\u0631", "\u0648", "\u0645"]
  - word: "\u0645\u064E\u0631\u0652\u062D\u064E\u0628\u064B\u0627"
    want: ["\u0645\u064E", "\u0631\u0652", "\u062D\u064E", "\u0628\u064B", "\u0627"]

  # Hebrew, where a letter may carry both a vowel point and a dot.
  - word: "\u05E9\u05B8\u05C1\u05DC\u05D5\u05B9\u05DD"
    want: ["\u05E9\u05B8\u05C1", "\u05DC", "\u05D5\u05B9", "\u05DD"]

  # What is not a letter is not one: a numeral, a mark standing on its own, and a
  # mark that takes a place of its own on the page but still belongs to a letter.
  - word: "1999"
    want: []
  - word: "\u0903"
    want: []
  - word: "a\u0903"
    want: ["a\u0903"]
  # A roman numeral is read aloud as a word and counts as one.
  - word: "\u216B"
    want: ["\u217B"]

normalize:
  # A letter and the mark above it are one letter, however the text spells them.
  # The same word typed one way and pasted another must compare the same, or a
  # reading loaded from a file disagrees with the same reading typed by hand.
  - word: "Ångström"
    want: "ångström"
  - word: "Ångström"
    want: "ångström"
  # A roman numeral is read aloud as a word and counts as one.
  - word: "Ⅻ"
    want: "ⅻ"
  - word: "beauty’s"
    want: "beautys"
  - word: "Feed'st"
    want: "feedst"
  - word: "world-without-end"
    want: "worldwithoutend"
  # A zero-width joiner is part of the word it joins, not punctuation between two
  # words: taking it out of a Persian or Devanagari word leaves a different word.
  # Where a language's letters are cut apart is not something each port may answer
  # for itself, and the answers on offer differ: one library cuts the joiner away,
  # another breaks a Devanagari conjunct in two.
  - word: "\u0645\u06CC\u200C\u0631\u0648\u0645"
    want: "\u0645\u06CC\u200C\u0631\u0648\u0645"
  - word: "\u0915\u094D\u200C\u0937"
    want: "\u0915\u094D\u200C\u0937"
  # A mark that takes a place of its own on the page still belongs to the letter
  # before it, and on its own is not a letter at all.
  - word: "a\u0903"
    want: "a\u0903"
  - word: "\u0903"
    want: ""

similarity:
  # Likeness is measured with the marks taken off. A recogniser trained on plain
  # Latin returns "casa" for "čaša", and in a four-letter word two lost marks put
  # it under any usable bar, so the word would not be found at all and would be
  # given a stretch of the recording belonging to its neighbours.
  - left: "čaša"
    right: "casa"
    equals: 1.0
  - left: "łódź"
    right: "lodz"
    equals: 1.0
  - left: "đak"
    right: "djak"
    at_least: 0.6
  - left: "shtëpi"
    right: "shtepi"
    equals: 1.0
  - left: "señor"
    right: "senor"
    equals: 1.0
  # Taking the marks off must not make two different words the same word.
  - left: "kuća"
    right: "muža"
    at_most: 0.6
  # A mark that is not a decoration on a letter stays. Every one of these is a
  # combining mark to Unicode, and a port that lifts whatever its own language
  # calls a diacritic answers "the same word" to all four.
  - left: "ざる"
    right: "さる"
    at_most: 0.6
  - left: "가나"
    right: "가다"
    at_most: 0.6
  - left: "नमस्ते"
    right: "नमसते"
    at_most: 0.6
  - left: "สวัสดี"
    right: "สวสด"
    at_most: 0.6
  # Counted in letters as a reader sees them, not in the pieces a letter is
  # stored as: by pieces these two are three edits apart out of six and would
  # pass, by letters they are two out of three and do not.
  - left: "नमस्ते"
    right: "नमस्त"
    at_most: 0.7
  - left: "beautys"
    right: "beautys"
    equals: 1.0
  - left: "feedst"
    right: "feed"
    at_least: 0.6
  - left: "thou"
    right: "increase"
    at_most: 0.4

# English syllables, counted by vowel groups less a silent final "e". Right enough
# to decide whether a long word gets more of a pause than a short one, and wrong on
# plenty of words besides; the cases below are the ones the count is held to.
english_syllables:
  - word: "I"
    count: 1
  - word: "rose"
    count: 1
  - word: "increase"
    count: 2
  - word: "memory"
    count: 3
  - word: "self-substantial"
    at_least: 4
  # A letter carrying a mark is one letter, and it is not a vowel of ours: counted
  # by code point instead, the dotted capital I of Turkish reads as a plain "i" and
  # the word gains a syllable it does not have.
  - word: "İstanbul"
    count: 2
  # The silent final "e" is the whole reason the count is not just vowel groups:
  # without the rule "rose" reads as two syllables and takes twice the airtime.
  - word: "stone"
    count: 1
  # Not dropped after "l", or "little" comes out as one syllable.
  - word: "little"
    count: 2

# A recogniser answers in tokens, not in words, and where one word ends is its own
# convention: a token opening with "▁" (or a space, or "|") opens a word. Each word is
# timed from the token it opens with to the one it closes with. Marks at the edges of a
# word are the model's punctuation and are left off; marks inside it are part of the word.
spoken:
  - name: "tokens are gathered into the words they spell"
    tokens:
      - {text: "▁be", start: 0.0, end: 0.1}
      - {text: "aut", start: 0.1, end: 0.2}
      - {text: "y's", start: 0.2, end: 0.3}
      - {text: "▁rose", start: 0.4, end: 0.6}
    equals:
      - {text: "beauty's", start: 0.0, end: 0.3}
      - {text: "rose", start: 0.4, end: 0.6}
  - name: "punctuation at the edge of a word is not part of it"
    tokens:
      - {text: "▁increase,", start: 1.0, end: 1.5}
    equals:
      - {text: "increase", start: 1.0, end: 1.5}
  - name: "a hyphen inside a word stays"
    tokens:
      - {text: "▁self-substantial", start: 2.0, end: 2.8}
    equals:
      - {text: "self-substantial", start: 2.0, end: 2.8}
  - name: "a token holding a space spells two words"
    tokens:
      - {text: "self substantial", start: 3.0, end: 3.8}
    equals:
      - {text: "self", start: 3.0, end: 3.8}
      - {text: "substantial", start: 3.0, end: 3.8}
  - name: "what the model could not spell belongs to no word"
    tokens:
      - {text: "▁the", start: 4.0, end: 4.2}
      - {text: "<unk>", start: 4.2, end: 4.4}
      - {text: "▁world", start: 4.4, end: 4.8}
    equals:
      - {text: "the", start: 4.0, end: 4.2}
      - {text: "world", start: 4.4, end: 4.8}
  - name: "a token that is punctuation alone leaves no word behind"
    tokens:
      - {text: "▁,", start: 5.0, end: 5.1}
    equals: []
