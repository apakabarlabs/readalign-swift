# Giving a time to every written word once the matched ones have theirs.
#
# `pairs` is what the matching found: a written word, and the heard word it came
# back as. Everything not listed there is what this stage has to place.
tests:
  - section: "A run with nowhere to go"
    cases:
      - name: "a word the recogniser ran into its neighbour still gets room of its own"
        why: >
          The recogniser writes "your self" as one word and the alignment matches
          that word to "self", leaving "your" between two marks that touch. Spread
          across a gap of nothing it came out with no length at all, and a word of
          no length is one the reader is never shown saying: it cannot be looked up
          at any instant of the recording, so it never lights up however well it was
          read. The room is taken from the neighbour that was holding both words,
          not from the one that was only holding its own.
        expected: ["were", "your", "self"]
        pairs:
          - {word: 0, text: "were", start: 1.60, end: 1.92}
          - {word: 2, text: "yourself", start: 1.92, end: 2.96}
        duration: 4
        want:
          - {word: 0, end: 1.92}
          - {word: 1, start: 1.92, end: 2.44}
          - {word: 2, end: 2.96}
        non_overlapping: true

      - name: "a gap barely wide enough is still the word's own gap"
        why: >
          Room is taken from a neighbour only when there is none to spread into. A
          gap of six hundredths is little, but it is the word's own, and taking it
          from the neighbour instead would move a mark that was measured.
        expected: ["were", "your", "self"]
        pairs:
          - {word: 0, text: "were", start: 1.60, end: 1.92}
          - {word: 2, text: "self", start: 1.98, end: 2.96}
        duration: 4
        want:
          - {word: 1, start: 1.92, end: 1.98}
          - {word: 2, start: 1.98, end: 2.96}

      - name: "a word with a gap to live in is left where the gap puts it"
        expected: ["were", "your", "self"]
        pairs:
          - {word: 0, text: "were", start: 1.60, end: 1.92}
          - {word: 2, text: "self", start: 2.42, end: 2.96}
        duration: 4
        want:
          - {word: 1, start: 1.92, end: 2.42}

  - section: "How a run is shared out"
    cases:
      - name: "English syllables give the long word most of the gap"
        why: >
          The weighting is what decides how a run nobody heard is shared out, so the
          case that shows it is two unmatched words of very different length between
          two matched ones. "extraordinary" counts five syllables against one for
          "we", so it takes five sixths of the eight seconds between them.
        expected: ["from", "extraordinary", "we", "go"]
        pairs:
          - {word: 0, text: "from", start: 0, end: 1}
          - {word: 3, text: "go", start: 9, end: 10}
        duration: 10
        weighting: "english"
        want:
          - {word: 1, start: 1, end: 7.667}
          - {word: 2, start: 7.667, end: 9}

      - name: "a weighting that answers with something that is not a number is not believed"
        why: >
          The weighting is written by whoever brings a language, so what comes back
          is not ours to trust. A comparison against a value that is not a number is
          false whichever way round it is put, so it travels straight through the
          floor below and every span computed from it comes out unusable, with no
          error anywhere to say why.
        expected: ["from", "extraordinary", "we", "go"]
        pairs:
          - {word: 0, text: "from", start: 0, end: 1}
          - {word: 3, text: "go", start: 9, end: 10}
        duration: 10
        weighting: "unusable"
        want:
          - {word: 1, start: 1, end: 5}
          - {word: 2, start: 5, end: 9}

      - name: "counting every word as one splits the gap down the middle"
        why: >
          The same run under a weighting that knows nothing about the language, which
          is what a language whose syllables this package cannot count gets.
        expected: ["from", "extraordinary", "we", "go"]
        pairs:
          - {word: 0, text: "from", start: 0, end: 1}
          - {word: 3, text: "go", start: 9, end: 10}
        duration: 10
        weighting: "even"
        want:
          - {word: 1, start: 1, end: 5}
          - {word: 2, start: 5, end: 9}
