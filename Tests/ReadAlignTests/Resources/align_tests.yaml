# The whole of it: a text, what a recogniser heard, and when each written word
# was spoken.
#
# Every case is held to the same three things whatever it pins: one span per
# written word, no span ending before it starts, and spans that never go
# backwards. `want` adds what the case itself is about.
tests:
  - section: "A reading the recogniser got right"
    cases:
      - name: "a clean transcript gives every word the time it was heard at"
        expected:
          ["From", "fairest", "creatures", "we", "desire", "increase",
           "That", "thereby", "beauty’s", "rose", "might", "never", "die"]
        heard:
          - {text: "from", start: 0, end: 0.8}
          - {text: "fairest", start: 1, end: 1.8}
          - {text: "creatures", start: 2, end: 2.8}
          - {text: "we", start: 3, end: 3.8}
          - {text: "desire", start: 4, end: 4.8}
          - {text: "increase", start: 5, end: 5.8}
          - {text: "that", start: 6, end: 6.8}
          - {text: "thereby", start: 7, end: 7.8}
          - {text: "beauty’s", start: 8, end: 8.8}
          - {text: "rose", start: 9, end: 9.8}
          - {text: "might", start: 10, end: 10.8}
          - {text: "never", start: 11, end: 11.8}
          - {text: "die", start: 12, end: 12.8}
        duration: 20
        want:
          - {word: 0, start: 0}
          - {word: 3, start: 3}
          - {word: 12, end: 12.8}

  - section: "A reading the recogniser got wrong"
    cases:
      - name: "a misheard word still lands on its own time"
        why: >
          Matched on how alike the words look rather than on equality, so a word the
          recogniser spelled its own way keeps the time it was heard at.
        expected:
          ["From", "fairest", "creatures", "we", "desire", "increase",
           "That", "thereby", "beauty’s", "rose", "might", "never", "die"]
        heard:
          - {text: "from", start: 0, end: 0.8}
          - {text: "farest", start: 1, end: 1.8}
          - {text: "creatures", start: 2, end: 2.8}
          - {text: "we", start: 3, end: 3.8}
          - {text: "desire", start: 4, end: 4.8}
          - {text: "increase", start: 5, end: 5.8}
          - {text: "that", start: 6, end: 6.8}
          - {text: "thereby", start: 7, end: 7.8}
          - {text: "beautys", start: 8, end: 8.8}
          - {text: "rose", start: 9, end: 9.8}
          - {text: "might", start: 10, end: 10.8}
          - {text: "never", start: 11, end: 11.8}
          - {text: "die", start: 12, end: 12.8}
        duration: 20
        want:
          - {word: 1, start: 1}
          - {word: 8, start: 8}

      - name: "words the recogniser dropped are spread across the gap they left"
        why: >
          Everything between "From" and "increase" goes missing. The four dropped
          words share the space instead of piling up on one instant, which is where
          none of them could be found.
        expected:
          ["From", "fairest", "creatures", "we", "desire", "increase",
           "That", "thereby", "beauty’s", "rose", "might", "never", "die"]
        heard:
          - {text: "from", start: 0, end: 0.5}
          - {text: "increase", start: 6, end: 6.5}
        duration: 20
        want:
          - {word: 0, start: 0}
          - {word: 5, start: 6}
          - {word: 1, start_at_least: 0.5}
          - {word: 4, end_at_most: 6.001}
        strictly_increasing: [1, 5]

      - name: "a word the reader never said does not steal a match"
        why: >
          An "um" between two words costs less to pass over than to pair with one of
          them, so it does not push a written word off its own time. "we" is heard in
          the fourth second, and that is the second it must come back with: pairing
          the "um" with it instead would hand it the third.
        expected:
          ["From", "fairest", "creatures", "we", "desire", "increase",
           "That", "thereby", "beauty’s", "rose", "might", "never", "die"]
        heard:
          - {text: "from", start: 0, end: 0.8}
          - {text: "fairest", start: 1, end: 1.8}
          - {text: "creatures", start: 2, end: 2.8}
          - {text: "um", start: 3, end: 3.8}
          - {text: "we", start: 4, end: 4.8}
          - {text: "desire", start: 5, end: 5.8}
          - {text: "increase", start: 6, end: 6.8}
          - {text: "that", start: 7, end: 7.8}
          - {text: "thereby", start: 8, end: 8.8}
          - {text: "beauty’s", start: 9, end: 9.8}
          - {text: "rose", start: 10, end: 10.8}
          - {text: "might", start: 11, end: 11.8}
          - {text: "never", start: 12, end: 12.8}
          - {text: "die", start: 13, end: 13.8}
        duration: 20
        want:
          - {word: 2, start: 2}
          - {word: 3, start: 4}
          - {word: 12, start: 13}

      - name: "a written word is left unplaced rather than paired with a stranger"
        why: >
          Passing both words over has to cost less than pairing them, or every word
          the recogniser invents lands on a written word and reports it at an instant
          nobody said it. Here nothing in the recording is "home", so "home" is placed
          across what is left of the recording rather than onto the stranger's second.
        expected: ["house", "home"]
        heard:
          - {text: "house", start: 0, end: 1}
          - {text: "zzz", start: 5, end: 6}
        duration: 10
        want:
          - {word: 0, start: 0, end: 1}
          - {word: 1, start: 1, end: 10}

      - name: "a word that merely rhymes with the written one is not it"
        why: >
          "kerb" and "curb" are the same sound and half the same letters, which is
          well under the bar and has to stay there: the bar is what separates a word
          spelled its own way from a different word standing in the same place.
        expected: ["kerb"]
        heard:
          - {text: "curb", start: 5, end: 6}
        duration: 10
        want:
          - {word: 0, start: 0, end: 10}

      - name: "passing two words over costs less than pairing them badly"
        why: >
          The whole reason a skip is priced below a bad pair. Priced the other way
          round, the alignment would rather put "house" opposite "zzz" than leave
          both alone, and would then have no heard word left for "home" -- which is
          in the recording, at its own second, and would lose it.
        expected: ["house", "home"]
        heard:
          - {text: "zzz", start: 0, end: 1}
          - {text: "home", start: 5, end: 6}
        duration: 8
        want:
          - {word: 1, start: 5, end: 6}

      - name: "a word too unlike the one written does not take its time"
        why: >
          Below the bar, a pairing is worse than passing both words over. Otherwise
          any two words that are merely not opposites pair, and the written word is
          reported at an instant nobody said it. Unmatched, it is placed across the
          whole recording instead, which says only that it is somewhere in there.
        expected: ["thou"]
        heard:
          - {text: "increase", start: 5, end: 6}
        duration: 10
        want:
          - {word: 0, start: 0, end: 10}

  - section: "Languages other than English"
    cases:
      - name: "polish: a word the recogniser spelled its own way keeps its own second"
        why: >
          Measured, not invented: this is a reading of a real tier and a real
          transcript of it, where the recogniser wrote "rozgardiasz" as
          "rozgardiarz". The whole reading was thrown away over that one letter
          before the alignment learned to tolerate it.
        expected:
          ["chaos", "nieład", "wrzawa", "rozgardiasz", "awantura",
           "bijatyka", "krzyk", "bunt", "alarm", "tumult"]
        heard:
          - {text: "Chaos", start: 0, end: 0.8}
          - {text: "Nieład", start: 1, end: 1.8}
          - {text: "Wrzawa", start: 2, end: 2.8}
          - {text: "Rozgardiarz", start: 3, end: 3.8}
          - {text: "Awantura", start: 4, end: 4.8}
          - {text: "Bijatyka", start: 5, end: 5.8}
          - {text: "Krzyk", start: 6, end: 6.8}
          - {text: "Bunt", start: 7, end: 7.8}
          - {text: "Alarm", start: 8, end: 8.8}
          - {text: "Tumult", start: 9, end: 9.8}
        duration: 12
        weighting: "even"
        want:
          - {word: 3, start: 3, end: 3.8}
          - {word: 9, start: 9, end: 9.8}

      - name: "serbian: a diacritic the recogniser dropped does not lose the word"
        why: >
          A recogniser trained on plain Latin returns "ć" as "c" and "š" as "s".
          Measured before the marks were taken off: in a four-letter word two lost
          marks put it under the bar, so "čaša" was not found at all and was given
          a stretch running from the end of "kuća" to the start of "šuma" -- the
          highlight landing on a word nobody was saying.
        expected: ["kuća", "čaša", "šuma", "đak"]
        heard:
          - {text: "kuca", start: 0, end: 0.8}
          - {text: "casa", start: 1, end: 1.8}
          - {text: "suma", start: 2, end: 2.8}
          - {text: "djak", start: 3, end: 3.8}
        duration: 5
        weighting: "even"
        want:
          - {word: 0, start: 0, end: 0.8}
          - {word: 1, start: 1, end: 1.8}
          - {word: 2, start: 2, end: 2.8}
          - {word: 3, start: 3, end: 3.8}

      - name: "albanian: a digraph written as one letter is still the same word"
        why: >
          Albanian writes sounds as two letters that a recogniser may return as
          one, and the other way round. Matched on likeness, so "shtëpi" survives
          coming back as "shtepi".
        expected: ["shtëpi", "rrugë", "njeri", "dhomë"]
        heard:
          - {text: "shtepi", start: 0, end: 0.8}
          - {text: "rruge", start: 1, end: 1.8}
          - {text: "njeri", start: 2, end: 2.8}
          - {text: "dhome", start: 3, end: 3.8}
        duration: 5
        weighting: "even"
        want:
          - {word: 0, start: 0, end: 0.8}
          - {word: 3, start: 3, end: 3.8}

      - name: "georgian: a script with no capitals and no latin letters aligns the same"
        why: >
          Nothing in the alignment may assume the Latin alphabet. Georgian has one
          case rather than two, so lowercasing changes nothing, and every letter is
          outside the ASCII range.
        expected: ["სახლი", "წიგნი", "მზე", "ქალაქი"]
        heard:
          - {text: "სახლი", start: 0, end: 0.8}
          - {text: "წიგნი", start: 1, end: 1.8}
          - {text: "მზე", start: 2, end: 2.8}
          - {text: "ქალაქი", start: 3, end: 3.8}
        duration: 5
        weighting: "even"
        want:
          - {word: 0, start: 0, end: 0.8}
          - {word: 3, start: 3, end: 3.8}

      - name: "spanish: two written words heard as one share the stretch between them"
        why: >
          Spanish runs words together in speech, and a recogniser writes what it
          hears: "de el" comes back as "del". Both written words have to come out
          of that one stretch rather than both being given all of it.
        expected: ["casa", "de", "el", "pueblo"]
        heard:
          - {text: "casa", start: 0, end: 1}
          - {text: "del", start: 1, end: 2}
          - {text: "pueblo", start: 2, end: 3}
        duration: 4
        weighting: "even"
        want:
          - {word: 0, start: 0, end: 1}
          - {word: 1, start: 1, end: 1.5}
          - {word: 2, start: 1.5, end: 2}
          - {word: 3, start: 2, end: 3}

  - section: "Pairs the caller vouches for"
    cases:
      - name: "a word the caller vouches for keeps the time it was heard at"
        why: >
          Measured, not invented: read aloud, "queue" is heard and written down as
          "cue", and "rustle" as "Russell". The word was said correctly and the
          recording is good, so the caller who knows the two sound alike says so,
          and the word takes its own second instead of being passed over.
        expected: ["wait", "queue", "linger"]
        heard:
          - {text: "wait", start: 0, end: 0.8}
          - {text: "cue", start: 1, end: 1.8}
          - {text: "linger", start: 2, end: 2.8}
        duration: 4
        equivalent:
          - {written: "queue", heard: "cue"}
        want:
          - {word: 1, start: 1, end: 1.8}

  - section: "Nothing heard at all"
    cases:
      - name: "nothing heard at all yields nothing rather than a guess"
        expected: ["From", "fairest", "creatures"]
        heard: []
        duration: 20
        want_empty: true
