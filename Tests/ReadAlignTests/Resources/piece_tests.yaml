# Cutting a recording into the pieces a recogniser is asked one at a time.
#
# Every side has to cut the same reading the same way, so the cases say it in samples: a
# port that agrees with these agrees with every other port, and one that drifts is red
# here rather than a word short on one platform a month later.
#
# A case describes the recording rather than shipping one — stretches of a level and a
# length, which every port builds into samples for itself — and then names what the cut
# comes to, in samples, `[start, end)`. The rules are the shared ones: `piece_seconds`,
# `shortest_piece_share` and `pause_seconds`.
#
# The quiet in these cases is a room rather than digital silence, because that is what a
# recording holds and because the threshold is taken from the recording itself: the
# quietest tenth of it is called the room, so a case whose quiet is too small a share of
# it has no room to find, and every frame reads as quiet. That is not a flaw in the
# cases; it is the same thing happening to a reading with hardly a pause in it.

# Where the recording is quiet long enough that a cut takes no word in half. The middle
# of each stretch of quiet, in samples.
pauses:
  - name: "a pause between two stretches of speech is found in its middle"
    sample_rate: 1000
    waveform:
      - {level: 0.5, seconds: 1.0}
      - {level: 0.001, seconds: 0.4}
      - {level: 0.5, seconds: 1.0}
    equals: [1200]
  - name: "a stop inside a word is too short to cut in"
    sample_rate: 1000
    waveform:
      - {level: 0.5, seconds: 1.0}
      - {level: 0.001, seconds: 0.1}
      - {level: 0.5, seconds: 0.5}
      - {level: 0.001, seconds: 0.4}
      - {level: 0.5, seconds: 1.0}
    equals: [1800]
  - name: "speech with no pause in it offers nowhere to cut"
    sample_rate: 1000
    waveform:
      - {level: 0.5, seconds: 2.0}
    equals: []
  - name: "the quiet a recording ends in is a pause like any other"
    sample_rate: 1000
    waveform:
      - {level: 0.5, seconds: 1.0}
      - {level: 0.001, seconds: 0.5}
    equals: [1250]
  - name: "nothing but silence has no speech to be quiet between"
    sample_rate: 1000
    waveform:
      - {level: 0.0, seconds: 1.0}
    equals: []

# The pieces themselves.
cuts:
  - name: "a recording shorter than a piece is asked whole"
    sample_rate: 100
    waveform:
      - {level: 0.5, seconds: 8.0}
    equals: [[0, 800]]
  - name: "a recording exactly a piece long is asked whole"
    sample_rate: 100
    waveform:
      - {level: 0.5, seconds: 12.0}
    equals: [[0, 1200]]
  # Only a seam that would otherwise have no shared ground gets the standing overlap.
  # A floor under every short overlap was measured worse; that is a different rule.
  - name: "a long recording with no pause is cut on length alone"
    sample_rate: 100
    waveform:
      - {level: 0.5, seconds: 20.0}
    equals: [[0, 1200], [1000, 2000]]
  - name: "a pause late in the piece is where the cut falls"
    sample_rate: 100
    waveform:
      - {level: 0.5, seconds: 8.0}
      - {level: 0.001, seconds: 3.0}
      - {level: 0.5, seconds: 9.0}
    equals: [[0, 950], [750, 1950], [1750, 2000]]
  - name: "a pause too early to cut at leaves the standing overlap"
    sample_rate: 100
    waveform:
      - {level: 0.5, seconds: 2.0}
      - {level: 0.001, seconds: 3.0}
      - {level: 0.5, seconds: 15.0}
    equals: [[0, 1200], [1000, 2000]]
  - name: "two pauses in one piece: the cut takes the later, the overlap the earlier"
    sample_rate: 100
    waveform:
      - {level: 0.5, seconds: 6.0}
      - {level: 0.001, seconds: 1.5}
      - {level: 0.5, seconds: 2.0}
      - {level: 0.001, seconds: 1.5}
      - {level: 0.5, seconds: 7.0}
    equals: [[0, 1025], [675, 1800]]

# Joining what each piece came back with into one reading. The pieces overlap, so a word
# at a seam arrives twice, and the second copy is dropped by time and text together: the
# same word marked within `same_moment` of one already kept is one word.
#
# A case names the pieces in samples, what each of them returned in its own seconds, and
# the reading that comes out, in the seconds of the whole recording. The times are chosen
# to be exact in binary, so every port compares them as written rather than deciding for
# itself how close is close enough.
joins:
  - name: "a word the seam says twice is kept once, where the first piece put it"
    sample_rate: 1000
    pieces: [[0, 1500], [1000, 2500]]
    heard:
      - - {text: "when", start: 0.125, end: 0.375}
        - {text: "forty", start: 1.25, end: 1.5}
      - - {text: "forty", start: 0.375, end: 0.625}
        - {text: "winters", start: 0.75, end: 1.0}
    equals:
      - {text: "when", start: 0.125, end: 0.375}
      - {text: "forty", start: 1.25, end: 1.5}
      - {text: "winters", start: 1.75, end: 2.0}
  - name: "the same word said again later in the reading is a second word"
    sample_rate: 1000
    pieces: [[0, 2000]]
    heard:
      - - {text: "love", start: 0.5, end: 0.75}
        - {text: "love", start: 1.5, end: 1.75}
    equals:
      - {text: "love", start: 0.5, end: 0.75}
      - {text: "love", start: 1.5, end: 1.75}
  - name: "the pieces spell the seam word differently and it is still one word"
    sample_rate: 1000
    pieces: [[0, 1500], [1000, 2500]]
    heard:
      - - {text: "Winter's", start: 1.25, end: 1.5}
      - - {text: "winters", start: 0.375, end: 0.625}
    equals:
      - {text: "Winter's", start: 1.25, end: 1.5}
  - name: "a piece the recogniser had nothing to say about adds nothing"
    sample_rate: 1000
    pieces: [[0, 1500], [1000, 2500]]
    heard:
      - - {text: "hush", start: 0.25, end: 0.5}
      - []
    equals:
      - {text: "hush", start: 0.25, end: 0.5}
  - name: "a word is placed where it falls in the whole recording, not in its piece"
    sample_rate: 1000
    pieces: [[1000, 2500]]
    heard:
      - - {text: "answer", start: 0.25, end: 0.5}
    equals:
      - {text: "answer", start: 1.25, end: 1.5}
  - name: "the seam word is one word however far apart the two pieces mark it"
    sample_rate: 1000
    pieces: [[0, 1500], [1000, 2500]]
    heard:
      - - {text: "when", start: 0.125, end: 0.375}
        - {text: "forty", start: 1.0, end: 1.25}
      - - {text: "forty", start: 0.45, end: 0.7}
        - {text: "winters", start: 0.75, end: 1.0}
    equals:
      - {text: "when", start: 0.125, end: 0.375}
      - {text: "forty", start: 1.0, end: 1.25}
      - {text: "winters", start: 1.75, end: 2.0}
  - name: "a word the reading says twice at the seam is kept twice"
    sample_rate: 1000
    pieces: [[0, 1500], [1000, 2500]]
    heard:
      - - {text: "live", start: 1.05, end: 1.15}
        - {text: "live", start: 1.25, end: 1.35}
      - - {text: "live", start: 0.05, end: 0.15}
        - {text: "live", start: 0.25, end: 0.35}
        - {text: "remembered", start: 0.75, end: 1.0}
    equals:
      - {text: "live", start: 1.05, end: 1.15}
      - {text: "live", start: 1.25, end: 1.35}
      - {text: "remembered", start: 1.75, end: 2.0}
  - name: "a word invented at the edge of a piece goes, and the overlap is not said twice"
    sample_rate: 1000
    pieces: [[0, 1500], [1000, 2500]]
    heard:
      - - {text: "time", start: 1.05, end: 1.2}
        - {text: "decease", start: 1.25, end: 1.4}
        - {text: "we", start: 1.45, end: 1.49}
      - - {text: "time", start: 0.06, end: 0.21}
        - {text: "decease", start: 0.26, end: 0.41}
        - {text: "his", start: 0.75, end: 1.0}
    equals:
      - {text: "time", start: 1.05, end: 1.2}
      - {text: "decease", start: 1.25, end: 1.4}
      - {text: "his", start: 1.75, end: 2.0}
  - name: "pieces that disagree about the overlap keep what each of them said"
    sample_rate: 1000
    pieces: [[0, 1500], [1000, 2500]]
    heard:
      - - {text: "distains", start: 1.25, end: 1.5}
      - - {text: "disdains", start: 0.375, end: 0.625}
        - {text: "the", start: 0.75, end: 1.0}
    equals:
      - {text: "distains", start: 1.25, end: 1.5}
      - {text: "disdains", start: 1.375, end: 1.625}
      - {text: "the", start: 1.75, end: 2.0}
  - name: "an unmatched word before the seam agreement is discarded"
    sample_rate: 1000
    pieces: [[0, 2000], [1000, 3000]]
    heard:
      - - {text: "so", start: 0.5, end: 0.75}
        - {text: "would", start: 1.3, end: 1.45}
        - {text: "I", start: 1.5, end: 1.6}
        - {text: "say", start: 1.65, end: 1.8}
      - - {text: "How", start: 0.1, end: 0.25}
        - {text: "would", start: 0.3, end: 0.45}
        - {text: "I", start: 0.5, end: 0.6}
        - {text: "say", start: 0.65, end: 0.8}
        - {text: "next", start: 1.2, end: 1.5}
    equals:
      - {text: "so", start: 0.5, end: 0.75}
      - {text: "would", start: 1.3, end: 1.45}
      - {text: "I", start: 1.5, end: 1.6}
      - {text: "say", start: 1.65, end: 1.8}
      - {text: "next", start: 2.2, end: 2.5}

# A transcript missing for a piece, or one too many, is refused rather than paired off
# until the shorter of the two runs out: every word after the missing one would be placed
# at the wrong moment of the recording, and the reading would come back looking whole.
join_refusals:
  - name: "a piece with no transcript at all is refused"
    sample_rate: 1000
    pieces: [[0, 1500], [1000, 2500]]
    heard:
      - - {text: "when", start: 0.125, end: 0.375}
  - name: "a transcript belonging to no piece is refused"
    sample_rate: 1000
    pieces: [[0, 1500]]
    heard:
      - - {text: "when", start: 0.125, end: 0.375}
      - - {text: "forty", start: 0.375, end: 0.625}

# Recovering a recogniser answer that stopped before later speech in the same piece.
# `answers` are returned in order, once for each request made by `Pieces.heard`.
heard:
  - name: "earlier speech does not replace a nonempty answer"
    sample_rate: 100
    waveform:
      - {level: 0.1, seconds: 3.0}
      - {level: 0.0, seconds: 2.0}
      - {level: 0.1, seconds: 5.0}
    answers:
      - - {text: "anchor", start: 5.0, end: 6.0}
        - {text: "after", start: 7.0, end: 8.0}
      - - {text: "before", start: 1.0, end: 2.0}
        - {text: "anchor", start: 5.0, end: 6.0}
    asked_lengths: [1000]
    equals:
      - {text: "anchor", start: 5.0, end: 6.0}
      - {text: "after", start: 7.0, end: 8.0}
  - name: "a stopped answer is recovered without repeating its two context words"
    sample_rate: 100
    waveform:
      - {level: 0.1, seconds: 5.0}
      - {level: 0.0, seconds: 2.0}
      - {level: 0.1, seconds: 3.0}
    answers:
      - - {text: "before", start: 3.0, end: 4.0}
        - {text: "seam", start: 4.0, end: 5.0}
      - - {text: "before", start: 1.0, end: 2.0}
        - {text: "seam", start: 2.0, end: 3.0}
        - {text: "after", start: 5.0, end: 6.0}
    asked_lengths: [1000, 800]
    equals:
      - {text: "before", start: 3.0, end: 4.0}
      - {text: "seam", start: 4.0, end: 5.0}
      - {text: "after", start: 7.0, end: 8.0}
  - name: "one context word is enough to recover a stopped answer"
    sample_rate: 100
    waveform:
      - {level: 0.1, seconds: 5.0}
      - {level: 0.0, seconds: 2.0}
      - {level: 0.1, seconds: 3.0}
    answers:
      - - {text: "anchor", start: 4.0, end: 5.0}
      - - {text: "anchor", start: 2.0, end: 3.0}
        - {text: "after", start: 5.0, end: 6.0}
    asked_lengths: [1000, 800]
    equals:
      - {text: "anchor", start: 4.0, end: 5.0}
      - {text: "after", start: 7.0, end: 8.0}
  - name: "trailing silence after a complete answer is not asked again"
    sample_rate: 100
    waveform:
      - {level: 0.1, seconds: 1.0}
      - {level: 0.0, seconds: 9.0}
    answers:
      - - {text: "heard", start: 0.0, end: 1.0}
    asked_lengths: [1000]
    equals:
      - {text: "heard", start: 0.0, end: 1.0}
