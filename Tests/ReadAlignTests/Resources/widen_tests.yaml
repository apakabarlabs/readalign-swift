# Widening a word to the quiet on both sides of it.
#
# A case describes the recording the way the hold corpus does: stretches of a
# level and a length, built into samples by every port for itself.
#
# A recogniser marks a word from where it is sure of it, which is past the
# consonant it opens with: the burst of a "c" or a "ch" is quieter than the voice
# and comes before the vowel the recogniser locks on to. Cut at the mark, "crime"
# is heard as "prime" and "cheat" as "sheet". So the start goes back over the
# quiet before the word, and the end on over the quiet after it, and the
# consonant comes back with the quiet it sits in.
#
# Here the room is 0.001, a voice 0.5, and a consonant's burst 0.003: louder
# than the room and still below what the rules count as speech.
tests:
  - section: "A word given back the quiet around it"
    cases:
      - name: "the consonant before the mark is given back to the word"
        why: >
          The burst sits between the pause and the vowel, below speech, and the mark
          falls on the vowel. The start goes back over the burst and the pause, and
          the end of the word before comes forward over the same pause, until the
          two meet at its middle, so neither word takes a frame of the other's.
        sample_rate: 1000
        waveform:
          - {level: 0.5, seconds: 0.10}
          - {level: 0.001, seconds: 0.20}
          - {level: 0.003, seconds: 0.05}
          - {level: 0.5, seconds: 0.15}
          - {level: 0.001, seconds: 0.20}
        spans:
          - {start: 0.00, end: 0.10}
          - {start: 0.35, end: 0.50}
        want:
          - {word: 0, end: 0.225}
          - {word: 1, start: 0.225}

      - name: "the start goes back no further than where the word before stops sounding"
        why: >
          The word before was marked short, so the middle of the gap between the
          marks lies inside its sound. The start goes back over the burst and the
          pause and stops where that sound is still going: the quiet is this word's,
          the sound before it is not.
        sample_rate: 1000
        waveform:
          - {level: 0.5, seconds: 0.30}
          - {level: 0.001, seconds: 0.10}
          - {level: 0.003, seconds: 0.05}
          - {level: 0.5, seconds: 0.15}
          - {level: 0.001, seconds: 0.10}
        spans:
          - {start: 0.00, end: 0.05}
          - {start: 0.45, end: 0.60}
        want:
          - {word: 1, start: 0.30}

      - name: "the end goes on no further than where the word after starts sounding"
        why: >
          The same from the other side: the word after was marked late, so the
          middle of the gap lies inside its sound, and the end stops where that
          sound begins.
        sample_rate: 1000
        waveform:
          - {level: 0.001, seconds: 0.10}
          - {level: 0.5, seconds: 0.15}
          - {level: 0.001, seconds: 0.10}
          - {level: 0.5, seconds: 0.30}
        spans:
          - {start: 0.10, end: 0.25}
          - {start: 0.60, end: 0.65}
        want:
          - {word: 0, end: 0.35}

      - name: "words with no quiet between them keep their marks"
        why: >
          The voice never drops between the two, so there is no pause to give either
          of them, and the gap between the marks is the recogniser's to answer for.
          Walking into it would hand one word the sound of the other.
        sample_rate: 1000
        waveform:
          - {level: 0.001, seconds: 0.10}
          - {level: 0.5, seconds: 0.60}
          - {level: 0.001, seconds: 0.10}
        spans:
          - {start: 0.10, end: 0.35}
          - {start: 0.45, end: 0.70}
        want:
          - {word: 0, end: 0.35}
          - {word: 1, start: 0.45}

      - name: "words whose marks overlap keep them where they meet"
        why: >
          Two written words matched to one heard token come back sharing its
          stretch. There is no gap between them to divide, so the edges they share
          stay where they are.
        sample_rate: 1000
        waveform:
          - {level: 0.001, seconds: 0.10}
          - {level: 0.5, seconds: 0.40}
          - {level: 0.001, seconds: 0.10}
        spans:
          - {start: 0.10, end: 0.35}
          - {start: 0.25, end: 0.50}
        want:
          - {word: 0, end: 0.35}
          - {word: 1, start: 0.25}

      - name: "an edge that would move by less than the least widening stays on its mark"
        why: >
          Twenty milliseconds is two frames, which no listener hears and every
          recogniser answers differently: a cut moved that little changes what comes
          back without changing what is said. The gap between the two words gives
          each of them ten milliseconds, so neither edge moves.
        sample_rate: 1000
        waveform:
          - {level: 0.001, seconds: 0.10}
          - {level: 0.5, seconds: 0.20}
          - {level: 0.001, seconds: 0.02}
          - {level: 0.5, seconds: 0.20}
          - {level: 0.001, seconds: 0.10}
        spans:
          - {start: 0.10, end: 0.30}
          - {start: 0.32, end: 0.52}
        want:
          - {word: 0, end: 0.30}
          - {word: 1, start: 0.32}

      - name: "each edge is weighed on its own"
        why: >
          The quiet before the word is too short to give it anything, the quiet after
          it is long. The start stays on its mark and the end still goes on, rather
          than the word being left alone because one side had nothing to give.
        sample_rate: 1000
        waveform:
          - {level: 0.001, seconds: 0.10}
          - {level: 0.5, seconds: 0.20}
          - {level: 0.001, seconds: 0.04}
          - {level: 0.5, seconds: 0.16}
          - {level: 0.001, seconds: 0.30}
        spans:
          - {start: 0.10, end: 0.30}
          - {start: 0.34, end: 0.50}
        want:
          - {word: 1, start: 0.34, end: 0.80}

      - name: "an edge that would move by exactly the least widening moves"
        why: >
          The limit holds both edges to thirty milliseconds, which is the least
          widening itself. The distance is counted in samples, so every port answers
          the same at the boundary instead of on which side a float rounded: in
          seconds, 0.35 less 0.32 comes out just short of 0.03.
        sample_rate: 16000
        limit: 0.03
        waveform:
          - {level: 0.001, seconds: 0.35}
          - {level: 0.5, seconds: 0.10}
          - {level: 0.001, seconds: 0.35}
        spans:
          - {start: 0.35, end: 0.45}
        want:
          - {word: 0, start: 0.32, end: 0.48}

      - name: "an edge that would move by a sample less than the least widening stays"
        why: >
          One millisecond short of the least widening, and both edges stay on their
          marks.
        sample_rate: 1000
        limit: 0.029
        waveform:
          - {level: 0.001, seconds: 1.00}
          - {level: 0.5, seconds: 0.10}
          - {level: 0.001, seconds: 1.00}
        spans:
          - {start: 1.00, end: 1.10}
        want:
          - {word: 0, start: 1.00, end: 1.10}

  - section: "The edges of the recording and the standing limit"
    cases:
      - name: "neither edge passes the ends of the recording"
        why: >
          One word, its mark inside its own sound, with a little quiet before it and
          after it. Its own sound past the mark is walked through, then the quiet,
          and both edges stop at the ends of the recording.
        sample_rate: 1000
        waveform:
          - {level: 0.001, seconds: 0.10}
          - {level: 0.003, seconds: 0.05}
          - {level: 0.5, seconds: 0.25}
          - {level: 0.001, seconds: 0.05}
        spans:
          - {start: 0.20, end: 0.30}
        want:
          - {word: 0, start: 0.00, end: 0.45}

      - name: "a word reaches into the quiet no further than the standing limit"
        why: >
          A long pause on either side and nothing beyond it, so only the limit the
          rules carry stops either edge. Otherwise a word after a pause between
          stanzas would be cut with the whole pause in front of it.
        sample_rate: 1000
        limit: 0.2
        waveform:
          - {level: 0.001, seconds: 1.00}
          - {level: 0.5, seconds: 0.10}
          - {level: 0.001, seconds: 1.00}
        spans:
          - {start: 1.00, end: 1.10}
        want:
          - {word: 0, start: 0.80, end: 1.30}

      - name: "a recording with nothing in it leaves the marks alone"
        why: >
          Nothing to measure the room against, so nothing is moved.
        sample_rate: 16000
        waveform: []
        spans:
          - {start: 0.05, end: 0.10}
        want:
          - {word: 0, start: 0.05, end: 0.10}

  - section: "Two words marked edge to edge"
    cases:
      - name: "a shared edge in the next word's opening sound goes back to the middle of the pause before it"
        why: >
          A list read in one breath comes back with its words marked edge to edge, and the
          recogniser marks a word from where it is sure of it: the hiss of an "s" or an "f"
          already sounds before the mark. Left there, the earlier word's cut ends on the
          next word's first sound, and a learner hears "detergent s". From the shared mark
          the sound is walked back to the pause the voice left, and the edge goes to its
          middle, as two words with a gap between their marks meet there.
        sample_rate: 1000
        waveform:
          - {level: 0.5, seconds: 0.30}
          - {level: 0.001, seconds: 0.25}
          - {level: 0.5, seconds: 0.30}
        spans:
          - {start: 0.00, end: 0.65}
          - {start: 0.65, end: 0.85}
        want:
          - {word: 0, end: 0.425}
          - {word: 1, start: 0.425}

      - name: "a shared edge in the earlier word's closing sound goes on to the middle of the pause after it"
        why: >
          The same mistake the other way: the mark falls before the earlier word has
          finished sounding, so the sound is walked on to the pause after it.
        sample_rate: 1000
        waveform:
          - {level: 0.5, seconds: 0.30}
          - {level: 0.001, seconds: 0.25}
          - {level: 0.5, seconds: 0.30}
        spans:
          - {start: 0.00, end: 0.20}
          - {start: 0.20, end: 0.85}
        want:
          - {word: 0, end: 0.425}
          - {word: 1, start: 0.425}

      - name: "marks that meet on one sample are edge to edge, whatever arithmetic placed them"
        why: >
          The same instant comes back a hair apart when the two marks were reached by
          different sums, a piece's offset added to a time inside it. Compared in
          samples, they still meet, and the edge they share is still moved out of the
          next word's opening sound.
        sample_rate: 1000
        waveform:
          - {level: 0.5, seconds: 0.30}
          - {level: 0.001, seconds: 0.25}
          - {level: 0.5, seconds: 0.30}
        spans:
          - {start: 0.00, end: 0.6500000000000001}
          - {start: 0.65, end: 0.85}
        want:
          - {word: 0, end: 0.425}
          - {word: 1, start: 0.425}

      - name: "two words said in one breath keep the edge they share"
        why: >
          Words inside a line follow one another without a pause, and there is no quiet
          near their shared mark to move it into.
        sample_rate: 1000
        waveform:
          - {level: 0.5, seconds: 0.70}
          - {level: 0.001, seconds: 0.30}
        spans:
          - {start: 0.00, end: 0.30}
          - {start: 0.30, end: 0.70}
        want:
          - {word: 0, end: 0.30}
          - {word: 1, start: 0.30}

      - name: "the stop before a consonant is not a pause to move a shared edge into"
        why: >
          A word's own stop is quiet too, but shorter than a pause, and an edge moved into
          it would cut a word in half.
        sample_rate: 1000
        waveform:
          - {level: 0.5, seconds: 0.20}
          - {level: 0.001, seconds: 0.06}
          - {level: 0.5, seconds: 0.30}
        spans:
          - {start: 0.00, end: 0.40}
          - {start: 0.40, end: 0.56}
        want:
          - {word: 0, end: 0.40}
          - {word: 1, start: 0.40}

      - name: "a short word before a pause keeps its edge with the word before it"
        why: >
          Walked on from the mark, the short word's sound soon gives way to the pause after
          it, but that pause is the short word's own: moved there, the edge would leave it
          nothing. An edge goes no further than the middle of the neighbour it moves into.
        sample_rate: 1000
        waveform:
          - {level: 0.5, seconds: 0.30}
          - {level: 0.5, seconds: 0.10}
          - {level: 0.001, seconds: 0.50}
          - {level: 0.5, seconds: 0.20}
        spans:
          - {start: 0.00, end: 0.30}
          - {start: 0.30, end: 0.90}
          - {start: 0.90, end: 1.10}
        want:
          - {word: 0, end: 0.30}
          - {word: 1, start: 0.30}

      - name: "digital silence in a reading does not turn the hiss of its pauses into speech"
        why: >
          A synthesised voice leaves stretches of exact zero, and the quietest tenth of
          the frames falls on them: measured against the room alone, the faint hiss of
          the pause between two words would stand above it as speech, there would be no
          pause to move the shared edge into, and the earlier word would end on the next
          one's opening sound. Measured against the voice, the hiss is quiet.
        sample_rate: 1000
        waveform:
          - {level: 0.0, seconds: 0.20}
          - {level: 0.5, seconds: 0.30}
          - {level: 0.004, seconds: 0.25}
          - {level: 0.5, seconds: 0.30}
        spans:
          - {start: 0.20, end: 0.85}
          - {start: 0.85, end: 1.05}
        want:
          - {word: 0, end: 0.625}
          - {word: 1, start: 0.625}

  - section: "Two words with a gap between their marks"
    cases:
      - name: "a start marked inside the vowel the word opens with goes back to the middle of the pause before it"
        why: >
          A word that opens with a vowel is marked from where the recogniser is sure of
          it, a fifth of a second into the vowel, while the word before is marked to end
          where that vowel begins. The gap between the marks is the vowel's own first
          stretch, not quiet, and its middle is still inside the vowel: cut there, the
          learner hears the word without its first sound. From the start in sound, both
          words meet in the middle of the pause the voice left before the vowel.
        sample_rate: 1000
        waveform:
          - {level: 0.5, seconds: 0.30}
          - {level: 0.001, seconds: 0.25}
          - {level: 0.5, seconds: 0.30}
        spans:
          - {start: 0.00, end: 0.55}
          - {start: 0.70, end: 0.85}
        want:
          - {word: 0, end: 0.425}
          - {word: 1, start: 0.425}

      - name: "an end marked before the word stops sounding goes on to the middle of the pause after it"
        why: >
          The same mistake the other way: the earlier word's mark ends while it still
          sounds, and the gap after it holds the rest of the word. The end is walked on
          to the pause after it and both words meet in its middle.
        sample_rate: 1000
        waveform:
          - {level: 0.5, seconds: 0.30}
          - {level: 0.001, seconds: 0.25}
          - {level: 0.5, seconds: 0.30}
        spans:
          - {start: 0.00, end: 0.20}
          - {start: 0.60, end: 0.85}
        want:
          - {word: 0, end: 0.425}
          - {word: 1, start: 0.425}

      - name: "a gap inside one breath leaves both marks where they are"
        why: >
          Two words said without a pause can come back with a sliver between their marks,
          and with no quiet near it there is nowhere to move either edge.
        sample_rate: 1000
        waveform:
          - {level: 0.5, seconds: 0.70}
          - {level: 0.001, seconds: 0.30}
        spans:
          - {start: 0.00, end: 0.30}
          - {start: 0.35, end: 0.70}
        want:
          - {word: 0, end: 0.30}
          - {word: 1, start: 0.35}
